; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; IMPORTANT - PSRAM NOTE:
; The ESP32-S3 SuperMini board used here has 2MB of quad-SPI PSRAM.
; Many common ESP32-S3 modules (e.g. N16R8) ship with 8MB of octal-SPI PSRAM,
; which is a frequent source of confusion. Do NOT assume 8MB is available.
; Actual PSRAM size is confirmed in boards/supermini.json: "psram_size": "2MB".
; Memory budget: ~128KB used by delay buffers, leaving ~1.88MB for 16 ADPCM sample slots.
; Total sample duration capacity: ~123 seconds across all 16 slots combined.

[env:supermini]
platform = espressif32
board = supermini  ; Uses custom board definition from boards/supermini.json
framework = arduino
build_flags =  
    -std=gnu++11
    -Wall
    -Iinclude
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
board_build.flash_mode = qio
board_build.f_flash = 80000000L 
board_build.arduino.memory_type = qio_qspi
board_build.partitions = huge_app.csv
build_src_filter = +<*> -<HardwareTest/>
upload_speed = 9216
monitor_speed = 115200
lib_deps = 
    olikraus/U8g2@^2.35.19
    adafruit/Adafruit NeoPixel@^1.12.0 
    fortyseveneffects/MIDI Library@^5.0.2